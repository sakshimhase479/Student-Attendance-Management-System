<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add New Student</title>
    <link rel="stylesheet" type="text/css" href="addStudent.css">
</head>
<body>
    <div class="main-container">
        <a href="Dashboard.jsp" style="color: #b3b3b3; text-decoration: none; position: absolute; top: 20px; left: 20px; font-size: 14px;">← Back to DashBoard</a>

        <div class="login-card">
            <h2>ADD STUDENT</h2>
            <p style="color: #b3b3b3; margin-bottom: 25px; font-size: 14px;">Register a new student in the system</p>
            
            <form action="AddStudentServlet" method="post">
                <div class="input-group">
                    <label>Student Full Name</label>
                    <input type="text" name="name" placeholder="e.g.Sakshi Mhase" required>
                </div>
                
                <div class="input-group">
                    <label>Course / Department</label>
                    <input type="text" name="course" placeholder="e.g.BCS" required>
                </div>
                
                <input type="submit" value="ADD STUDENT" class="btn-login">
            </form>
        </div>
    </div>
</body>
</html>
