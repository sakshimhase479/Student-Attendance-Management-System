<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sakshi's Student Login</title>
<link rel="stylesheet" type="text/css" href="style.css">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
	rel="stylesheet">
</head>
<body>
	<div class="login-container">
		<h2>Welcome Back</h2>
		<p>Login to manage your attendance</p>
		<form action="LoginServlet" method="post">
			<input type="text" name="username" class="input-field"
				placeholder="Username" required> <input type="password"
				name="password" class="input-field" placeholder="Password" required>
			<button type="submit" class="login-btn">Log In</button>
		</form>

		<div class="footer">Student Attendance Management System</div>
	</div>
</body>
</html>
